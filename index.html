<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詩詞找句｜說個情境，找一句古人替你說</title>
<meta name="description" content="描述你的情境或心情，AI 幫你找出貼切的成語、典故、唐詩宋詞元曲與新詩名句，附出處、白話與用法，寫卡片、致詞、文案都能直接引用。">
<meta property="og:title" content="詩詞找句｜說個情境，找一句古人替你說">
<meta property="og:description" content="輸入情境，找出貼切的成語典故、唐詩宋詞元曲與新詩，附出處與白話解釋。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5efe3;
    --paper: #fbf7ef;
    --ink: #2b2620;
    --ink-soft: #6b6157;
    --line: #e2d8c6;
    --seal: #b0322a;
    --seal-soft: #f3dcd6;
    --chip: #efe6d5;
    --good: #3d7a4a;
    --warn: #a86a12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1916;
      --paper: #24211d;
      --ink: #ece4d6;
      --ink-soft: #a89e90;
      --line: #3a352e;
      --seal: #e0645a;
      --seal-soft: #3d2622;
      --chip: #2e2a25;
      --good: #7cc48a;
      --warn: #e0a54a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1916; --paper: #24211d; --ink: #ece4d6; --ink-soft: #a89e90;
    --line: #3a352e; --seal: #e0645a; --seal-soft: #3d2622; --chip: #2e2a25;
    --good: #7cc48a; --warn: #e0a54a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif TC", "Songti TC", serif;
    line-height: 1.8;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  header { text-align: center; margin-bottom: 32px; }
  .seal {
    display: inline-block;
    border: 2px solid var(--seal);
    color: var(--seal);
    padding: 2px 8px;
    font-size: 13px;
    letter-spacing: 4px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  h1 { font-size: clamp(32px, 7vw, 48px); font-weight: 900; margin: 0; letter-spacing: 6px; }
  .sub { color: var(--ink-soft); margin: 8px 0 0; }

  form {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    border: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 17px;
    outline: none;
  }
  textarea::placeholder { color: var(--ink-soft); opacity: .7; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 12px; }
  .count { font-size: 13px; color: var(--ink-soft); }
  button.go {
    background: var(--seal);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font: inherit;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
  }
  button.go:disabled { opacity: .5; cursor: wait; }

  .examples { margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .examples span { font-size: 13px; color: var(--ink-soft); align-self: center; }
  .chip {
    background: var(--chip);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 999px;
    padding: 4px 12px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  #status { text-align: center; color: var(--ink-soft); margin: 32px 0 0; min-height: 1em; }
  #status.err { color: var(--seal); }
  .loading::after { content: "…"; animation: dots 1.2s steps(3) infinite; display: inline-block; width: 1.2em; text-align: left; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0 } to { width: 1.2em } }

  #results { display: grid; gap: 16px; margin-top: 24px; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid var(--seal);
    border-radius: 8px;
    padding: 20px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tag { font-size: 12px; color: var(--seal); background: var(--seal-soft); border-radius: 4px; padding: 0 8px; letter-spacing: 1px; }
  .copy {
    background: none; border: 1px solid var(--line); color: var(--ink-soft);
    border-radius: 6px; padding: 2px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .types { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 0; border-top: 1px dashed var(--line); }
  .types-label { font-size: 13px; color: var(--ink-soft); }
  .tchip {
    background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
    border-radius: 6px; padding: 2px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .tchip[aria-pressed="true"] { background: var(--seal); border-color: var(--seal); color: #fff; }
  .tclear { background: none; border: none; color: var(--ink-soft); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 0; }
  .ex { background: var(--seal-soft); border-radius: 8px; padding: 12px 16px; margin: 0 0 12px; }
  .ex-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--seal); letter-spacing: 1px; }
  .ex p { margin: 4px 0 0; font-size: 16px; }
  .acts { display: flex; gap: 8px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { font-size: 12px; border-radius: 4px; padding: 0 8px; border: 1px solid; }
  .badge.good { color: var(--good); border-color: var(--good); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.bad { color: #fff; background: var(--seal); border-color: var(--seal); }
  .badge.neutral { color: var(--ink-soft); border-color: var(--line); }
  a.copy { text-decoration: none; }
  .quote { font-size: clamp(19px, 4.5vw, 23px); font-weight: 600; margin: 12px 0 4px; letter-spacing: 1px; }
  .by { color: var(--ink-soft); font-size: 14px; margin: 0 0 12px; }
  .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; }
  .card dt { color: var(--ink-soft); }
  .card dd { margin: 0; }

  footer { margin-top: 48px; text-align: center; font-size: 13px; color: var(--ink-soft); }
  footer a { color: inherit; }
  @media (max-width: 480px) {
    .card dl { grid-template-columns: 1fr; gap: 0; }
    .card dd { margin-bottom: 8px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="seal">詩詞找句</div>
    <h1>借古人一句話</h1>
    <p class="sub">說說你的情境或心情，找一句成語、典故、詩詞來替你說</p>
  </header>

  <form id="f">
    <label for="q" style="position:absolute;left:-9999px">描述你的情境</label>
    <textarea id="q" maxlength="300" placeholder="例如：好朋友下個月要出國工作，想在送別卡片上寫一句話"></textarea>
    <div class="types" id="types" role="group" aria-label="引用類型">
      <span class="types-label">類型（不選＝不限）</span>
    </div>
    <div class="row">
      <span class="count"><span id="n">0</span> / 300</span>
      <button class="go" id="go" type="submit">找詩句</button>
    </div>
  </form>

  <div class="examples" id="ex">
    <span>試試看：</span>
  </div>

  <p id="status" role="status" aria-live="polite"></p>
  <section id="results"></section>

  <footer>
    內容由 AI 整理，再拿開源典籍資料庫逐句核對；資料庫沒收錄的作品無法核對，正式引用前請再查證一次。<br>
    核對資料：<a href="https://github.com/chinese-poetry/chinese-poetry" target="_blank" rel="noopener">chinese-poetry</a>（全唐詩、全宋詞、元曲、詩經、楚辭、四書、古文觀止等）、<a href="https://github.com/pwxcoo/chinese-xinhua" target="_blank" rel="noopener">chinese-xinhua</a>（成語）<br>
    由 <a href="https://aiqkangber.com" target="_blank" rel="noopener">Q kangber</a> 用 n8n＋AI 打造
  </footer>
</main>

<script>
const API = 'https://123422222222.zeabur.app/webhook/poem-finder';
const EXAMPLES = [
  '好朋友要出國工作，想在送別卡片上寫一句話',
  '加班到半夜終於做完，看著窗外有點空虛',
  '爸媽結婚三十週年，想寫一句祝福',
  '考試落榜，想鼓勵自己再拚一次',
  '中秋節一個人在外地過'
];

const TYPES = ['成語', '典故', '詩經楚辭', '唐詩', '宋詞', '元曲', '古文', '其他古詩詞', '新詩'];

const $ = id => document.getElementById(id);
const q = $('q'), go = $('go'), status = $('status'), results = $('results');

TYPES.forEach(t => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tchip'; b.textContent = t; b.dataset.type = t;
  b.setAttribute('aria-pressed', 'false');
  b.onclick = () => { b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); syncClear(); };
  $('types').appendChild(b);
});
const clear = document.createElement('button');
clear.type = 'button'; clear.className = 'tclear'; clear.textContent = '清除'; clear.hidden = true;
clear.onclick = () => { document.querySelectorAll('.tchip').forEach(b => b.setAttribute('aria-pressed', 'false')); syncClear(); };
$('types').appendChild(clear);
function selectedTypes() { return [...document.querySelectorAll('.tchip[aria-pressed="true"]')].map(b => b.dataset.type); }
function syncClear() { clear.hidden = selectedTypes().length === 0; }

EXAMPLES.forEach(t => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.textContent = t;
  b.onclick = () => { q.value = t; updateCount(); search(); };
  $('ex').appendChild(b);
});

function updateCount() { $('n').textContent = q.value.length; }
q.addEventListener('input', updateCount);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); search(); }
});
$('f').addEventListener('submit', e => { e.preventDefault(); search(); });

function setStatus(text, cls) { status.textContent = text; status.className = cls || ''; }

function citation(it) {
  const by = [it.era, it.author].filter(Boolean).join('·');
  const src = it.source ? `〈${it.source}〉` : '';
  return `${it.text}${by || src ? ' ——' + by + src : ''}`;
}

async function copy(btn, text, label) {
  try { await navigator.clipboard.writeText(text); btn.textContent = '已複製'; }
  catch { btn.textContent = '複製失敗'; }
  setTimeout(() => btn.textContent = label, 1500);
}

function render(items) {
  results.innerHTML = '';
  items.forEach(it => {
    const card = document.createElement('article');
    card.className = 'card';
    const by = [it.era, it.author].filter(Boolean).join('·') + (it.source ? `〈${it.source}〉` : '');
    card.innerHTML = `
      <div class="card-top"><span class="tag-row"><span class="tag"></span></span><span class="acts"><a class="copy verify" target="_blank" rel="noopener">查證</a><button class="copy" type="button">複製引用</button></span></div>
      <p class="quote"></p>
      <p class="by"></p>
      <div class="ex"><div class="ex-head"><span>例句</span><button class="copy ex-copy" type="button">複製例句</button></div><p></p></div>
      <dl><dt>白話</dt><dd class="m"></dd><dt>怎麼用</dt><dd class="u"></dd></dl>`;
    card.querySelector('.tag').textContent = it.type || '詩詞';
    if (it.check) {
      const b = document.createElement('span');
      b.className = 'badge ' + it.check.cls; b.textContent = it.check.label; b.title = it.check.tip;
      card.querySelector('.tag-row').appendChild(b);
    }
    card.querySelector('.quote').textContent = it.text;
    card.querySelector('.by').textContent = by;
    card.querySelector('.m').textContent = it.meaning;
    card.querySelector('.u').textContent = it.fit;
    const exBox = card.querySelector('.ex');
    if (it.example) {
      exBox.querySelector('p').textContent = it.example;
      const eb = exBox.querySelector('.ex-copy');
      eb.onclick = () => copy(eb, it.example, '複製例句');
    } else exBox.remove();
    card.querySelector('.verify').href = 'https://www.google.com/search?q=' + encodeURIComponent('"' + it.text.replace(/[，。？！；、：]/g, ' ').trim().split(/\s+/)[0] + '" ' + (it.author || ''));
    const btn = card.querySelector('.acts button.copy');
    btn.onclick = () => copy(btn, citation(it), '複製引用');
    results.appendChild(card);
  });
}

async function search() {
  const text = q.value.trim();
  if (text.length < 2) { setStatus('請先描述一下情境', 'err'); q.focus(); return; }
  go.disabled = true;
  results.innerHTML = '';
  setStatus('翻書中', 'loading');
  status.scrollIntoView({ behavior: 'smooth', block: 'center' });
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: text, types: selectedTypes() })
    });
    const data = await res.json().catch(() => ({}));
    if (!data.ok) { setStatus(data.error || '出了點狀況，稍後再試', 'err'); return; }
    setStatus('核對原文中', 'loading');
    const items = await withTimeout(verifyAll(data.items), 6000).catch(() => data.items);
    setStatus('');
    render(items);
    results.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch {
    setStatus('連線失敗，稍後再試', 'err');
  } finally {
    go.disabled = false;
  }
}

// ── 原文核對 ──────────────────────────────────────────────
// 跟 scripts/build-index.mjs 同一套 normalize（繁轉簡＋異體字折疊）與 FNV-1a，改一邊要改另一邊再重建 idx/
const VARIANTS = '隣邻鄰邻鑪炉爐炉汙污沈沉裏里裡里嘆叹歎叹箇个綫线鬭斗鬥斗嚐尝甞尝牀床牕窗窓窗窻窗峯峰羣群迴回囘回煙烟鴈雁栢柏盃杯柸杯闇暗晻暗衹只祇只秖只秪只粧妆妝妆鏁锁恠怪蹤踪跡迹蹟迹著着於于喫吃凴凭憑凭卻却皁皂溼湿濕湿惟唯脣唇鵰雕彫雕凋雕糢模㬉暖煖暖讎仇讐仇疎疏踈疏遶绕繞绕酧酬醻酬竝并並并簷檐';
const VMAP = new Map(); for (let i = 0; i < VARIANTS.length; i += 2) VMAP.set(VARIANTS[i], VARIANTS[i + 1]);
// 資料庫幾乎收全的類型：查不到就很可能是錯的；其他類型查不到只代表沒收錄
const COVERED = ['唐詩', '宋詞', '元曲', '詩經楚辭'];
const CHECK = {
  author: { cls: 'good', label: '✓ 原文與作者已核對', tip: '每一句都在典籍資料庫中找到，作者也相符', rank: 0 },
  text: { cls: 'good', label: '✓ 原文已核對', tip: '每一句都在典籍資料庫中找到（作者寫法不同或未標）', rank: 0 },
  idiom: { cls: 'good', label: '✓ 成語辭典有收錄', tip: '在成語辭典中找到這個成語', rank: 0 },
  partial: { cls: 'warn', label: '△ 部分字句與收錄版本不同', tip: '有些句子找得到、有些找不到，可能是版本差異，也可能記錯了', rank: 1 },
  unknown: { cls: 'neutral', label: '○ 資料庫未收錄，請自行查證', tip: '這類出處不在核對資料庫裡，無法自動核對', rank: 2 },
  missing: { cls: 'bad', label: '⚠ 查無此句，可能有誤', tip: '這類作品資料庫收錄完整卻找不到這句，很可能是 AI 記錯或編造', rank: 3 }
};

let t2sPromise;
function getT2s() {
  return t2sPromise ||= new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/opencc-js@1.4.2/dist/umd/t2cn.js';
    sc.onload = () => resolve(OpenCC.Converter({ from: 'tw', to: 'cn' }));
    sc.onerror = reject;
    document.head.appendChild(sc);
  });
}
const fnv1a = s => { let h = 0x811c9dc5; for (const ch of s) { const c = ch.codePointAt(0); h ^= c & 0xff; h = Math.imul(h, 0x01000193); h ^= c >>> 8; h = Math.imul(h, 0x01000193); } return h >>> 0; };
const shardCache = new Map();
function shard(path) {
  if (!shardCache.has(path)) shardCache.set(path, fetch('idx/' + path).then(r => r.ok ? r.arrayBuffer() : new ArrayBuffer(0)).then(b => new DataView(b)));
  return shardCache.get(path);
}
// 分片內依雜湊排序，二分搜尋找第一筆，回傳該句所有作者雜湊
async function lookup(h) {
  const dv = await shard('s/' + (h >>> 20).toString(16).padStart(3, '0') + '.bin');
  const n = dv.byteLength / 6;
  let lo = 0, hi = n;
  while (lo < hi) { const m = (lo + hi) >> 1; if (dv.getUint32(m * 6, true) < h) lo = m + 1; else hi = m; }
  const authors = [];
  for (let i = lo; i < n && dv.getUint32(i * 6, true) === h; i++) authors.push(dv.getUint16(i * 6 + 4, true));
  return authors;
}
async function isIdiom(h) {
  const dv = await shard('idiom/' + (h >>> 24).toString(16).padStart(2, '0') + '.bin');
  let lo = 0, hi = dv.byteLength / 4;
  while (lo < hi) { const m = (lo + hi) >> 1; const v = dv.getUint32(m * 4, true); if (v === h) return true; if (v < h) lo = m + 1; else hi = m; }
  return false;
}

async function verifyOne(it, t2s) {
  const norm = x => [...t2s(String(x || '')).replace(/[^\u3400-\u9fff\uf900-\ufaff]/g, '')].map(c => VMAP.get(c) || c).join('');
  const whole = norm(it.text);
  if (whole.length >= 3 && whole.length <= 8 && await isIdiom(fnv1a(whole))) return CHECK.idiom;
  const clauses = t2s(it.text).split(/[，。？！；：、,.?!;:\s「」『』“”‘’（）()《》〈〉·—…\-\[\]]+/).map(norm).filter(c => c.length >= 3);
  if (!clauses.length) return CHECK.unknown;
  const ah = fnv1a(norm(it.author)) & 0xffff;
  let hit = 0, auth = 0;
  for (const c of clauses) { const a = await lookup(fnv1a(c)); if (a.length) hit++; if (a.includes(ah)) auth++; }
  if (hit === clauses.length) return auth === clauses.length && it.author ? CHECK.author : CHECK.text;
  if (hit) return CHECK.partial;
  return COVERED.includes(it.type) ? CHECK.missing : CHECK.unknown;
}

async function verifyAll(items) {
  const t2s = await getT2s();
  const checked = await Promise.all(items.map(async it => ({ ...it, check: await verifyOne(it, t2s).catch(() => null) })));
  return checked.map((it, i) => [it, i]).sort((a, b) => ((a[0].check?.rank ?? 2) - (b[0].check?.rank ?? 2)) || a[1] - b[1]).map(x => x[0]);
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
</script>
</body>
</html>
